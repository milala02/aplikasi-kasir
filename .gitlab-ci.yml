# Pipeline khusus Flutter (Bebas dari scanner Java/Gradle bawaan GitLab)
image: ghcr.io/cirruslabs/flutter:stable

variables:
  # Mematikan total Auto DevOps & template Security bawaan GitLab yang memicu Gradle
  AUTO_DEVOPS_DISABLED: "1"
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"

stages:
  - test

flutter_analyze_and_test:
  stage: test
  script:
    - flutter pub get
    - flutter analyze
    - flutter test


# ==========================================
# TRICK: MENCEGAH CRASH PADA SCANNER GRADLE
# ==========================================
# Kita membuat file local.properties tiruan sesaat sebelum scanner berjalan
# agar Gradle tidak crash saat mencari path Flutter SDK.

dependency_scanning:
  before_script:
    - echo "flutter.sdk=/tmp" > android/local.properties

gemnasium-dependency-scanning:
  before_script:
    - echo "flutter.sdk=/tmp" > android/local.properties

gemnasium-maven-dependency-scanning:
  before_script:
    - echo "flutter.sdk=/tmp" > android/local.properties

stages:
  - test
  - security

flutter_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable

  script:
    - flutter --version
    - flutter pub get
    - flutter analyze
    - flutter test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ==========================================
# GITLAB SECURITY SCANNERS CONFIG
# ==========================================
variables:
  # Menonaktifkan scanner bawaan GitLab (Gemnasium) karena tidak 
  # memiliki Flutter SDK dan akan selalu crash pada proyek Flutter
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"

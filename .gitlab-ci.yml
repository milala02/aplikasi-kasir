include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

image: ghcr.io/cirruslabs/flutter:stable

stages:
  - test

flutter_test:
  stage: test
  script:
    - flutter pub get
    - flutter analyze
    - flutter test

# Mengizinkan scanner bawaan GitLab gagal tanpa menggagalkan pipeline utama
dependency_scanning:
  allow_failure: true

gemnasium-dependency-scanning:
  allow_failure: true

gitlab-advanced-sast:
  allow_failure: true

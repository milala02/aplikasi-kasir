stages:
  - test
  - security

flutter_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable

  script:
    - flutter --version
    - flutter pub get
    - flutter analyze
    - flutter test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ==========================================
# OVERRIDE: MEMATIKAN SCANNER GRADLE/SAST NON-FLUTTER
# ==========================================
dependency_scanning:
  rules:
    - when: never

gemnasium-dependency-scanning:
  rules:
    - when: never

gemnasium-maven-dependency-scanning:
  rules:
    - when: never

gitlab-advanced-sast:
  rules:
    - when: never

stages:
  - test
  - security

flutter_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable

  script:
    - flutter --version
    - flutter pub get
    - flutter analyze
    - flutter test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ==========================================
# OVERRIDE: DISABLE SCANNERS PROPERLY
# ==========================================
variables:
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"

# Menyertakan 'script' dummy agar parser GitLab tidak protes "yaml invalid",
# sekaligus memastikan rules when: never mematikan job ini selamanya.
dependency_scanning:
  script:
    - echo "Dependency scanning dinonaktifkan."
  rules:
    - when: never

gitlab-advanced-sast:
  script:
    - echo "SAST dinonaktifkan."
  rules:
    - when: never

gemnasium-dependency-scanning:
  script:
    - echo "Scanner dinonaktifkan."
  rules:
    - when: never

gemnasium-maven-dependency-scanning:
  script:
    - echo "Scanner dinonaktifkan."
  rules:
    - when: never


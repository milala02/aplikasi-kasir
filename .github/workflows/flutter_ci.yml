name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Tests with Code Coverage
        run: flutter test --coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Debug with Secrets Injection
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          # --- SMART WRAPPER INJECTION ---
          # 1. Jalankan build (Cegat error palsu 'FileNotFound' dari Flutter CLI)
          flutter build apk --debug --dart-define=API_KEY="$API_KEY" --dart-define=BASE_URL="$BASE_URL" -v || echo "⚠️ Flutter CLI panik, tapi kita abaikan!"
          
          # 2. Cari lokasi asli APK yang baru saja dicetak oleh Gradle
          echo "🔍 Mencari APK yang disembunyikan Gradle..."
          APK_PATH=$(find build/app/outputs/apk -name "*.apk" | grep debug | head -n 1)
          
          # 3. Verifikasi dan berikan lampu hijau ke GitHub Actions
          if [ -n "$APK_PATH" ]; then
            echo "✅ APK BERHASIL DITEMUKAN DI: $APK_PATH"
            # Gandakan ke tempat yang diharapkan Flutter
            mkdir -p build/app/outputs/flutter-apk/
            cp "$APK_PATH" build/app/outputs/flutter-apk/app-debug.apk
            exit 0
          else
            echo "❌ APK benar-benar tidak ada. Build gagal murni."
            exit 1
          fi
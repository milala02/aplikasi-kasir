name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Tests with Code Coverage
        run: flutter test --coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/lcov.info

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Debug with Secrets Injection
        env:
          API_KEY: ${{ secrets.API_KEY || 'DEFAULT_API_KEY' }}
          BASE_URL: ${{ secrets.BASE_URL || 'https://localhost:8000' }}
        run: |
          echo "🔨 Building APK with environment variables..."
          echo "API_KEY is set: $([ -n '${{ secrets.API_KEY }}' ] && echo 'YES' || echo 'NO (using default)')"
          echo "BASE_URL is set: $([ -n '${{ secrets.BASE_URL }}' ] && echo 'YES' || echo 'NO (using default)')"
          
          flutter build apk --debug \
            --dart-define=API_KEY="${{ secrets.API_KEY || 'DEFAULT_API_KEY' }}" \
            --dart-define=BASE_URL="${{ secrets.BASE_URL || 'https://localhost:8000' }}" \
            -v
          
          echo "✅ APK build completed successfully!"

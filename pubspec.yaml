name: aplikasi_kasir
description: "Aplikasi POS Kasir Production-Grade"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & UI Components
  provider: ^6.1.2
  fl_chart: ^0.68.0
  
  # SQLite & Storage Engines
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3
  drift: ^2.18.0
  
  # Security & Authentication
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  
  # Receipt Printing & Sharing
  blue_thermal_printer: ^1.3.0
  mobile_scanner: ^5.1.1
  url_launcher: ^6.2.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
